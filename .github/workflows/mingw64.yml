name: MinGW64 UCRT CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test-publish:
    name: Build, run unit tests and publish
    runs-on: windows-latest
    env:
      BUILD_TARGET: mingw64
      BUILD_CONFIG: Release

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Windows dependencies
        shell: cmd
        run: |
          python -m pip install --upgrade pip
          choco install -y cmake
          choco install -y doxygen
          choco install -y graphviz
          choco install -y cppcheck

      - name: Install Python dependencies
        shell: cmd
        run: |
          python -m pip install -r tools\requirements.txt

      - name: Pin setup-python interpreter
        shell: powershell
        run: |
          $pythonHome = Split-Path (Get-Command python.exe).Source
          $pythonExe = Join-Path $pythonHome "python.exe"
          "PYTHON_EXE=$pythonExe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "PYTHON_HOME=$pythonHome" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Setup MSYS2 UCRT64
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          pacboy: >-
            toolchain:p
            clang:p
            clang-tools-extra:p
            libusb:p

      - name: Export MSYS2 environment
        shell: powershell
        run: |
          Add-Content $env:GITHUB_PATH $env:PYTHON_HOME
          Add-Content $env:GITHUB_PATH "${{ steps.msys2.outputs.msys2-location }}\ucrt64\bin"
          Add-Content $env:GITHUB_ENV "MSYS2_LOCATION=${{ steps.msys2.outputs.msys2-location }}"

      - name: Verify Python dependencies
        shell: powershell
        run: |
          Get-Command python.exe -All
          & $env:PYTHON_EXE -c "import sys, xmlschema; print(sys.executable); print(xmlschema.__version__)"

      - name: Clean generated files
        shell: powershell
        run: |
          Remove-Item -Recurse -Force build, dist -ErrorAction SilentlyContinue

      - name: Fetch and compile the application
        shell: cmd
        run: .\Build.bat all

      - name: Run static checks
        shell: cmd
        run: .\Build.bat check

      - name: Generate documentation
        shell: cmd
        run: .\Build.bat doc

#      - name: Run unit tests
#        shell: cmd
#        run: .\Build.bat utest

      - name: Publish successful artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: sample-mingw64-ucrt-dist
          path: dist/

      - name: Publish Cppcheck reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sample-mingw64-ucrt-cppcheck-reports
          path: |
            dist/cppcheck-result.xml
            dist/cppcheck-results.sarif
          if-no-files-found: ignore
